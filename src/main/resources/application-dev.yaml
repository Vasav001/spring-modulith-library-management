spring:
    datasource:
        url: jdbc:postgresql://localhost:5433/library_db
        username: library_user
        password: library_pass
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: false

    flyway:
        enabled: true
        locations: classpath:db/migration

    modulith:
        events:
            jdbc-schema-initialization:
                enabled: false

management:
    endpoints:
        web:
            exposure:
                include: health, info, prometheus, modulith

    endpoint:
        health:
            show-details: always

    metrics:
        tags:
            application: ${spring.application.name}

logging:
    level:
        root: INFO
        com.vasav: DEBUG