services:
    postgres:
        image: postgres:15
        container_name: library_postgres
        environment:
            POSTGRES_DB: library_db
            POSTGRES_USER: library_user
            POSTGRES_PASSWORD: library_pass
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U library_user -d library_db" ]
            interval: 15s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: